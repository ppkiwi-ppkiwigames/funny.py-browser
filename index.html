<style>

.tab.active{background:#242631;color:white;border-color:#343746}.compact-tabs .tab{min-width:78px;max-width:155px}.hide-bookmarks #bookmarkbar{display:none}.hide-clock #clock,.hide-clock #date{display:none}.tab .tabtitle{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}.tab .close{border:0;background:none;color:#85899a;padding:2px 4px;font-size:16px}.tab .close:hover{color:white}

h1{font-size:clamp(40px,6vw,64px);letter-spacing:-3px;margin:0;font-weight:800}.tagline{color:#9da1b1;margin:10px 0 30px;font-size:14px}

.favorite:hover{transform:translateY(-2px);border-color:#8c70ef;background:#242432}.favicon{font-size:22px}.favname{font-size:12px;color:#d8d9e1;font-weight:600}

#sidepanel.open{display:flex}.panelhead{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:750;font-size:14px}.panelbody{padding:15px;overflow:auto;flex:1}
.panelclose{border:0;background:none;color:#9da1b1;font-size:20px}.field{margin-bottom:17px}.field label{display:block;color:#aeb2c0;font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;height:36px;background:#101219;color:white;border:1px solid #343846;border-radius:8px;padding:0 10px}
.action{border:1px solid #383b49;background:#242733;border-radius:8px;padding:8px 11px}.action:hover{border-color:var(--accent)}.primary{background:var(--accent2);border-color:var(--accent2)}

#internalview.visible{display:block}.internal-wrap{max-width:1050px;margin:0 auto}.internal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.internal-top h2{font-size:27px;margin:0;letter-spacing:-1px}.internal-sub{color:#969bad;margin:7px 0 22px}.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:13px}.appcard{background:#1c1e29;border:1px solid #303342;border-radius:13px;padding:17px;min-height:150px;display:flex;flex-direction:column;align-items:flex-start;gap:9px}.appicon{width:43px;height:43px;border-radius:12px;background:#30294a;display:grid;place-items:center;font-size:22px}.appcard strong{font-size:14px}.appcard p{margin:0;color:#969bad;line-height:1.45;font-size:12px;flex:1}.appcard button{border:0;border-radius:8px;background:#7656e8;padding:8px 12px;font-weight:700}.appcard button.secondary{background:#2c2f3b;border:1px solid #414555}.internal-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.internal-toolbar button{border:1px solid #383b49;background:#242733;border-radius:8px;padding:8px 12px}.internal-toolbar button.selected{background:#7656e8}.internal-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}.privacy-cover{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#171923,#29223f);color:white}.privacy-cover.visible{display:flex}.privacy-cover .privacy-card{padding:36px 48px;border:1px solid #ffffff22;border-radius:20px;background:#11131acc;box-shadow:0 20px 80px #0009}.privacy-cover h2{font-size:30px;margin:0 0 8px}.privacy-cover p{color:#b8bbca;margin:0}.game-stage{background:#101116;border:1px solid #303342;border-radius:14px;padding:22px;max-width:680px;margin:22px auto;text-align:center}.game-score{font-size:50px;font-weight:800;margin:20px}.game-stage button{background:#7656e8;border:0;border-radius:10px;padding:12px 18px;font-weight:700}

@media(max-width:620px){#favorites{grid-template-columns:repeat(2,1fr)}.tab{min-width:95px;max-width:145px}#bookmarkbar{overflow-x:auto}.navbuttons button{width:27px}#go{padding:8px 10px}.homeinner{padding-top:6vh}}
</style>

<script>
"use strict";
const $=s=>document.querySelector(s);
const defaults={search:"https://www.google.com/search?q=",wisp:"wss://wisp.mercurywork.shop/",customWisp:"",favorites:[["Google","🔎","https://google.com"],["YouTube","▶️","https://youtube.com"],["Discord","💬","https://discord.com"],["Reddit","👾","https://reddit.com"],["Wikipedia","📚","https://wikipedia.org"],["Twitch","🟣","https://twitch.tv"],["GitHub","🐙","https://github.com"],["DuckDuckGo","🦆","https://duckduckgo.com"]],bookmarks:[],history:[],wallpaper:"",font:13,adblock:false};
let settings={...defaults,...load("funny_settings",{})};
let tabs=[],activeId=null,logs=[],panel=null,inspectMode=false,dragTab=null;
let gustEngineFrame=null,gustEngineReadyPromise=null;
function restartGustEngine(){if(gustEngineFrame){gustEngineFrame.remove();gustEngineFrame=null}gustEngineReadyPromise=null}
function ensureGustEngine(){
 if(gustEngineReadyPromise)return gustEngineReadyPromise;
 gustEngineReadyPromise=new Promise((resolve,reject)=>{
  const frame=document.createElement("iframe");frame.id="gustEngineFrame";frame.title="Funny.py WISP runtime";frame.style.cssText="position:absolute;inset:0;width:100%;height:100%;border:0;background:#101116;display:none;z-index:1";frame.setAttribute("allow","fullscreen; autoplay; clipboard-read; clipboard-write; gamepad");gustEngineFrame=frame;
  let synced=false,attempts=0,readyTimer=null;
  const fail=setTimeout(()=>{clearInterval(readyTimer);reject(new Error("GUST WISP engine did not finish starting"))},90000);
  frame.onload=()=>{
   try{
    const w=frame.contentWindow,d=w.document;
    if(!synced){
     const instance=w._sessionInstId;
     if(!instance){if(++attempts<8){setTimeout(()=>{try{frame.contentWindow.location.reload()}catch(e){}},400);return}throw new Error("Could not initialize GUST storage")}
     const prefs=load("funny_settings",settings),wisp=prefs.customWisp||prefs.wisp||"wss://wisp.mercurywork.shop/";
     w.localStorage.setItem(instance+":gust:wisp:v1",wisp);
     w.localStorage.setItem(instance+":gust:wisp:poolmode:v1","0");
     synced=true;w.location.reload();return;
    }
    const style=d.createElement("style");style.textContent="html,body{height:100%!important;margin:0!important;overflow:hidden!important;background:#101116!important}body>.app{position:fixed!important;inset:0!important;width:100%!important;height:100%!important}body>.app *{visibility:hidden!important}#frame{visibility:visible!important;position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;display:block!important;border:0!important;border-radius:0!important;z-index:2147483647!important}#overlay,#elemHighlightOverlay{display:none!important}";d.head.appendChild(style);
    readyTimer=setInterval(()=>{try{const ov=d.getElementById("overlay");if(ov&&ov.classList.contains("hidden")){clearInterval(readyTimer);clearTimeout(fail);resolve(frame)}}catch(e){}},250);
   }catch(e){clearTimeout(fail);reject(e)}
  };
  $("#stage").insertBefore(frame,$("#sidepanel"));frame.src="./gust-engine.html";
 });
 return gustEngineReadyPromise;
}
async function showProxiedPage(url){
 const frame=await ensureGustEngine(),d=frame.contentDocument;
 const input=d&&d.getElementById("url"),go=d&&d.getElementById("go");
 if(!input||!go)throw new Error("GUST navigation controls were not found");
 frame.style.display="block";$("#home").style.display="none";$("#internalview").classList.remove("visible");
 input.value=url;go.click();
}

function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function log(message,type="info"){logs.unshift({time:new Date().toLocaleTimeString(),message,type});logs=logs.slice(0,200)}
function toast(message){const el=$("#toast");el.textContent=message;el.style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display="none",2200)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normalize(value){
 value=String(value||"").trim();if(!value)return null;
 try{return new URL(value).href}catch(e){}
 if(value.includes(".")&&!value.includes(" "))return "https://"+value;
 return settings.search+encodeURIComponent(value);
}
function activeTab(){return tabs.find(t=>t.id===activeId)}
const BUILTIN_APPS=[\n {id:"interface-os",name:"Interf$ce OS",icon:"▦",description:"Interf$ce OS · whoisbro123.bonto.page",url:"https://whoisbro123.bonto.page",kind:"web"}\n];
const EXTENSIONS=[
 {id:"compact-tabs",name:"Compact tabs",description:"Use a denser tab strip."},
 {id:"hide-bookmarks",name:"Hide bookmarks bar",description:"Hide the bookmarks strip to free up space."},
 {id:"hide-clock",name:"Hide new-tab clock",description:"Hide the clock and date on the start page."}
];
function internalRoute(raw){
 const v=String(raw||"").trim().toLowerCase().replace(/^https?:\/\//,"");
 if(!v.startsWith("funny.py//"))return null;
 return v.slice("funny.py//".length).split(/[?#]/)[0]||"home";
}
function setInternalContent(html){
 const box=$("#internalview");box.innerHTML=html;box.classList.add("visible");$("#home").style.display="none";
 if(gustEngineFrame)gustEngineFrame.style.display="none";
}
function appIsInstalled(id){return (load("funny_installed_apps",[])||[]).includes(id)}
function installApp(id){const a=load("funny_installed_apps",["lumin-demo"]);if(!a.includes(id))a.push(id);save("funny_installed_apps",a);toast("App installed")}
function uninstallApp(id){save("funny_installed_apps",(load("funny_installed_apps",["lumin-demo"])||[]).filter(x=>x!==id));toast("App uninstalled")}
function openInternalApp(id){const app=BUILTIN_APPS.find(x=>x.id===id);if(!app){toast("App not found");return}if(!appIsInstalled(id)){toast("Install this app first");return}const t=activeTab()||createTab();t.url="funny.py//apps/"+id;t.title=app.name;$("#address").value=t.url;renderTabs();$("#home").style.display="none";$("#internalview").classList.remove("visible");showProxiedPage(app.url).then(()=>log("Opened "+app.name+" through GUST WISP","load")).catch(e=>{toast("Could not open app: "+e.message);log("App launch error: "+e.message,"error")})}
function renderAppStore(){
 const apps=BUILTIN_APPS.map(a=>'<article class="appcard"><div class="appicon">'+a.icon+'</div><strong>'+escapeHTML(a.name)+'</strong><p>'+escapeHTML(a.description)+'</p><button data-install="'+a.id+'">'+(appIsInstalled(a.id)?"Open":"Install")+'</button></article>').join("");
 setInternalContent('<div class="internal-wrap"><div class="internal-top"><div><h2>Apps</h2><div class="internal-sub">Install an app, then open it inside a Funny.py tab.</div></div><button class="action" onclick="navigate(\'funny.py//home\')">Home</button></div><div class="appgrid">'+apps+'</div><div class="internal-toolbar"><button onclick="navigate(\'funny.py//games\')">Games hub</button><button onclick="navigate(\'funny.py//extensions\')">Extensions hub</button><button onclick="navigate(\'funny.py//settings\')">Settings</button></div></div>');
 $("#internalview").querySelectorAll("[data-install]").forEach(b=>b.onclick=()=>{const id=b.dataset.install;if(appIsInstalled(id))openInternalApp(id);else{installApp(id);renderAppStore()}});
}
function renderGames(){
 setInternalContent('<div class="internal-wrap"><div class="internal-top"><div><h2>Games</h2><div class="internal-sub">Powered by the official LuminSDK game catalog.</div></div><button class="action" onclick="navigate(\'funny.py//apps\')">Apps</button></div><div id="luminStatus" class="internal-sub">Loading LuminSDK game library…</div><div id="luminGames" style="min-height:420px;background:#101116;border-radius:14px;padding:12px"></div><div class="internal-toolbar"><button onclick="navigate(\'funny.py//extensions\')">Extensions</button><button onclick="navigate(\'funny.py//settings\')">Settings</button></div></div>');
 loadLuminSDK();
}
function loadLuminSDK(){
 const status=$("#luminStatus"),mount=$("#luminGames");if(!mount)return;
 const init=()=>{if(!window.Lumin||typeof window.Lumin.init!=="function"){if(status)status.textContent="LuminSDK loaded but its API is unavailable.";return}
  Promise.resolve(window.Lumin.init({container:mount,theme:"dark",columns:5,rows:4,onReady:()=>{if(status)status.textContent="LuminSDK ready · choose a game to play"},onError:e=>{if(status)status.textContent="LuminSDK error: "+(e?.message||e)}})).catch(e=>{if(status)status.textContent="Could not load games: "+(e?.message||e)})};
 if(window.Lumin){init();return}
 let script=document.getElementById("lumin-sdk-script");
 if(!script){script=document.createElement("script");script.id="lumin-sdk-script";script.src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js";script.async=true;script.onload=init;script.onerror=()=>{if(status)status.textContent="LuminSDK could not load. Check your connection or CDN access."};document.head.appendChild(script)}
 else{script.addEventListener("load",init,{once:true})}
}
function renderGame(id){
 if(id!=="lumin-demo"){const custom=(load("funny_custom_games",[])||[]).find(g=>g.id===id);const render=window._funnyGameRender?.[id];if(custom&&typeof render==="function"){setInternalContent('<div class="internal-wrap"><div class="internal-top"><h2>'+escapeHTML(custom.name)+'</h2><button class="action" onclick="navigate(\'funny.py//games\')">All games</button></div><div id="customGameRoot"></div></div>');render($("#customGameRoot"),window.LuminSDK);return}setInternalContent('<div class="internal-wrap"><h2>Game not found</h2><button class="action" onclick="navigate(\'funny.py//games\')">Back</button></div>');return}
 setInternalContent('<div class="internal-wrap"><div class="internal-top"><div><h2>Lumin SDK Demo</h2><div class="internal-sub">funny.py//games/lumin-demo</div></div><button class="action" onclick="navigate(\'funny.py//games\')">All games</button></div><div class="game-stage"><p>Tap to earn points</p><div class="game-score" id="score">0</div><button id="tapGame">+1 point</button><p style="color:#9da1b1">Example game using window.LuminSDK</p></div></div>');
 let score=0;$("#tapGame").onclick=()=>{$("#score").textContent=String(++score);window.LuminSDK?.emit("score",score)};
}
function renderExtensions(){
 const enabled=load("funny_extensions",[]);
 setInternalContent('<div class="internal-wrap"><div class="internal-top"><div><h2>Extensions</h2><div class="internal-sub">Manage lightweight Funny.py interface extensions.</div></div><button class="action" onclick="navigate(\'funny.py//settings\')">Settings</button></div><div class="appgrid">'+EXTENSIONS.map(e=>'<article class="appcard"><div class="appicon">⌘</div><strong>'+e.name+'</strong><p>'+e.description+'</p><button class="extension-toggle" data-ext="'+e.id+'">'+(enabled.includes(e.id)?"Disable":"Enable")+'</button></article>').join("")+'</div></div>');
 $("#internalview").querySelectorAll("[data-ext]").forEach(b=>b.onclick=()=>{const id=b.dataset.ext;let list=load("funny_extensions",[]);list=list.includes(id)?list.filter(x=>x!==id):[...list,id];save("funny_extensions",list);applyExtensions();renderExtensions()});
}
function renderInternalSettings(){
 const cfg=load("funny_privacy",{enabled:false,preset:"midnight"});
 const options=[["wss://wisp.mercurywork.shop/","Default WISP · mercurywork.shop"],["wss://truffled.lol","Truffled · truffled.lol"],["wss://anura.pro","Anura · anura.pro"],["custom","Custom WISP URL"]];
 setInternalContent('<div class="internal-wrap"><div class="internal-top"><div><h2>Funny.py Settings</h2><div class="internal-sub">Browser preferences, WISP and privacy controls.</div></div><button class="action" onclick="navigate(\'funny.py//home\')">Home</button></div><div class="appgrid"><section class="appcard"><strong>Custom WISP</strong><p>Choose a WISP endpoint or enter your own. The GUST WISP engine uses this server for proxied browsing.</p><div class="field" style="width:100%"><label>WISP server</label><select id="wispChoice">'+options.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join("")+'</select></div><div class="field" style="width:100%"><label>Custom WISP URL</label><input id="customWisp" placeholder="wss://your-wisp.example"></div><button class="primary" id="saveWisp">Save WISP setting</button><p id="wispStatus" style="color:#9da1b1">Saved: '+escapeHTML(settings.customWisp||settings.wisp||options[0][0])+'</p></section><section class="appcard"><strong>Privacy screen</strong><p>Show a neutral cover when Funny.py loses focus.</p><label><input id="privacyEnabled" type="checkbox"> Enable privacy screen</label><div class="field" style="width:100%;margin-top:12px"><label>Screen style</label><select id="privacyPreset"><option value="midnight">Midnight</option><option value="violet">Violet gradient</option><option value="plain">Plain dark</option></select></div><button class="primary" id="savePrivacy">Save privacy settings</button></section></div><div class="internal-toolbar"><button onclick="navigate(\'funny.py//apps\')">Apps</button><button onclick="navigate(\'funny.py//games\')">Games</button><button onclick="navigate(\'funny.py//extensions\')">Extensions</button></div></div>');
 $("#privacyEnabled").checked=cfg.enabled;$("#privacyPreset").value=cfg.preset;
 const choice=$("#wispChoice"),custom=$("#customWisp");custom.value=settings.customWisp||"";
 choice.value=settings.customWisp?"custom":(settings.wisp||options[0][0]);if(!Array.from(choice.options).some(o=>o.value===choice.value))choice.value=options[0][0];
 custom.disabled=choice.value!=="custom";choice.onchange=()=>custom.disabled=choice.value!=="custom";
 $("#saveWisp").onclick=()=>{const value=choice.value==="custom"?custom.value.trim():choice.value;if(!/^wss:\/\//i.test(value)){toast("WISP URL must start with wss://");return}settings.wisp=value;settings.customWisp=choice.value==="custom"?value:"";save("funny_settings",settings);$("#wispStatus").textContent="Saved: "+value;restartGustEngine();toast("WISP saved. The next page will use this server.")};
 $("#savePrivacy").onclick=()=>{save("funny_privacy",{enabled:$("#privacyEnabled").checked,preset:$("#privacyPreset").value});applyPrivacyPreset();toast("Privacy settings saved")};
}
function renderInternal(route){
 const parts=route.split("/");const section=parts[0]||"home";
 if(section==="home"||section===""){showHome();$("#internalview").classList.remove("visible");return}
 if(section==="settings")renderInternalSettings();
 else if(section==="apps"&&parts[1])openInternalApp(parts[1]);
 else if(section==="apps")renderAppStore();
 else if(section==="games"&&parts[1])renderGame(parts[1]);
 else if(section==="games")renderGames();
 else if(section==="extensions")renderExtensions();
 else setInternalContent('<div class="internal-wrap"><h2>Funny.py page not found</h2><p class="internal-sub">Try funny.py//settings, funny.py//apps, funny.py//games, or funny.py//extensions.</p><button class="action" onclick="navigate(\'funny.py//home\')">Home</button></div>');
}
window.LuminSDK={
 version:"1.0-compatible",
 registerGame(def){if(!def||!def.id||!def.name||typeof def.render!=="function")throw new Error("Game requires id, name and render()");const list=load("funny_custom_games",[]);const clean={id:String(def.id),name:String(def.name),description:String(def.description||""),icon:String(def.icon||"🎮")};const next=list.filter(x=>x.id!==clean.id);next.push(clean);save("funny_custom_games",next);window._funnyGameRender=window._funnyGameRender||{};window._funnyGameRender[clean.id]=def.render;return clean},
 mount(node,html){if(typeof node==="string")node=document.querySelector(node);if(node)node.innerHTML=html},
 toast,save:(key,value)=>save("lumin_"+key,value),load:(key,fallback)=>load("lumin_"+key,fallback),
 navigate:url=>navigate(url),emit:(name,data)=>window.dispatchEvent(new CustomEvent("lumin:"+name,{detail:data}))
};
function applyExtensions(){const enabled=load("funny_extensions",[]);document.body.classList.toggle("compact-tabs",enabled.includes("compact-tabs"));document.body.classList.toggle("hide-bookmarks",enabled.includes("hide-bookmarks"));document.body.classList.toggle("hide-clock",enabled.includes("hide-clock"));}
function applyPrivacyPreset(){
 const cfg=load("funny_privacy",{enabled:false,preset:"midnight"});const cover=$("#privacyCover");if(!cover)return;
 const styles={midnight:"linear-gradient(135deg,#12141d,#25213a)",violet:"linear-gradient(135deg,#33205c,#7656e8)",plain:"#111218"};
 cover.style.background=styles[cfg.preset]||styles.midnight;
}
function privacyEvent(){const cfg=load("funny_privacy",{enabled:false,preset:"midnight"});$("#privacyCover")?.classList.toggle("visible",!!cfg.enabled&&document.visibilityState==="hidden")}

function createTab(url=null){
 const tab={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),url:null,title:"New Tab",history:[],index:-1,frame:null};
 tabs.push(tab);activeId=tab.id;tabs.forEach(x=>{if(x.frame){x.frame.style.display="none";x.frame.classList.remove("active")}});renderTabs();
 if(url)navigate(url);else showHome();
 return tab;
}
function renderTabs(){
 const root=$("#tabs");root.innerHTML="";
 tabs.forEach(t=>{
  const el=document.createElement("div");el.className="tab"+(t.id===activeId?" active":"");el.draggable=true;el.dataset.id=t.id;
  el.innerHTML='<span style="color:#a78bfa">◉</span><span class="tabtitle"></span><button class="close" title="Close tab">×</button>';
  el.querySelector(".tabtitle").textContent=t.title;
  el.addEventListener("click",e=>{if(e.target.closest(".close"))return;switchTab(t.id)});
  el.querySelector(".close").addEventListener("click",e=>{e.stopPropagation();closeTab(t.id)});
  el.addEventListener("dragstart",()=>{dragTab=t.id;el.style.opacity=".5"});
  el.addEventListener("dragend",()=>{dragTab=null;el.style.opacity="1"});
  el.addEventListener("dragover",e=>e.preventDefault());
  el.addEventListener("drop",e=>{e.preventDefault();const from=tabs.findIndex(x=>x.id===dragTab),to=tabs.findIndex(x=>x.id===t.id);if(from<0||to<0)return;const [m]=tabs.splice(from,1);tabs.splice(to,0,m);renderTabs()});
  root.appendChild(el);
 });
}
function switchTab(id){activeId=id;const t=activeTab();const route=t?.url?internalRoute(t.url):null;if(gustEngineFrame)gustEngineFrame.style.display="none";if(route!==null){renderInternal(route)}else if(t?.url){$("#internalview").classList.remove("visible");$("#home").style.display="none";showProxiedPage(t.url).catch(e=>{toast("WISP error: "+e.message);log("WISP error: "+e.message,"error")})}else{$("#internalview").classList.remove("visible");$("#home").style.display="flex"}$("#address").value=t?.url||"";renderTabs();closePanel()}
function closeTab(id){const i=tabs.findIndex(t=>t.id===id);if(i<0)return;const wasActive=activeId===id;if(tabs[i].frame)tabs[i].frame.remove();tabs.splice(i,1);if(!tabs.length){createTab();return}if(wasActive){activeId=tabs[Math.max(0,i-1)].id;switchTab(activeId)}else renderTabs()}
async function navigate(input,replace=false){const route=internalRoute(input);if(route!==null){const t=activeTab()||createTab();if(t.url&&!replace){t.history=t.history.slice(0,t.index+1);t.history.push(t.url);t.index++}t.url="funny.py//"+route;t.title="Funny.py · "+(route.split("/")[0]||"Home");if(gustEngineFrame)gustEngineFrame.style.display="none";$("#address").value=t.url;renderTabs();renderInternal(route);log("Opened internal route "+t.url);return}const url=normalize(input);if(!url)return;const t=activeTab()||createTab();try{if(t.url&&!replace){t.history=t.history.slice(0,t.index+1);t.history.push(t.url);t.index++}t.url=url;try{t.title=new URL(url).hostname}catch(e){t.title=url}$("#home").style.display="none";$("#address").value=url;$("#internalview").classList.remove("visible");renderTabs();log("Connecting through GUST WISP: "+url,"navigation");await showProxiedPage(url);log("WISP navigation started: "+url,"load");settings.history.unshift({url,title:t.title,time:Date.now()});settings.history=settings.history.slice(0,150);save("funny_settings",settings)}catch(e){console.error(e);toast("WISP navigation failed: "+e.message);log("WISP navigation error: "+e.message,"error")}}
function showHome(){if(gustEngineFrame)gustEngineFrame.style.display="none";const t=activeTab();if(t){t.url=null;t.title="New Tab"}$("#internalview").classList.remove("visible");$("#home").style.display="flex";$("#address").value="";renderTabs()}
function goBack(){const t=activeTab();if(!t)return;if(t.index>=0){const url=t.history[t.index];t.index--;navigate(url,true)}else if(gustEngineFrame){try{gustEngineFrame.contentWindow.document.getElementById("frame").contentWindow.history.back()}catch(e){}}}
function goForward(){const t=activeTab();if(!t)return;if(t.index+1<t.history.length){const url=t.history[++t.index];navigate(url,true)}else if(gustEngineFrame){try{gustEngineFrame.contentWindow.document.getElementById("frame").contentWindow.history.forward()}catch(e){}}}
function renderBookmarks(){
 $("#bookmarks").innerHTML="";settings.bookmarks.slice(0,9).forEach((b,i)=>{const btn=document.createElement("button");btn.className="bookmark";btn.textContent=b.title;btn.title=b.url;btn.onclick=()=>navigate(b.url);$("#bookmarks").appendChild(btn)});
}
function addBookmark(url,title){if(!url)return;if(settings.bookmarks.some(b=>b.url===url)){toast("Already bookmarked");return}settings.bookmarks.push({url,title:title||new URL(url).hostname});save("funny_settings",settings);renderBookmarks();toast("Bookmark saved")}
function renderFavorites(){
 $("#favorites").innerHTML="";settings.favorites.forEach(([name,icon,url])=>{const b=document.createElement("button");b.className="favorite";b.innerHTML='<span class="favicon"></span><span class="favname"></span>';b.querySelector(".favicon").textContent=icon;b.querySelector(".favname").textContent=name;b.onclick=()=>navigate(url);$("#favorites").appendChild(b)});
}
function openPanel(which){panel=which;$("#sidepanel").classList.add("open");const title={settings:"Settings",history:"History",bookmarks:"Bookmarks",tools:"Developer tools",downloads:"Downloads"}[which]||"Browser tools";$("#paneltitle").textContent=title;const body=$("#panelbody");
 if(which==="settings"){
 body.innerHTML='<div class="field"><label>Search engine</label><select id="searchEngine"><option value="https://www.google.com/search?q=">Google</option><option value="https://search.brave.com/search?q=">Brave</option><option value="https://duckduckgo.com/?q=">DuckDuckGo</option><option value="https://www.bing.com/search?q=">Bing</option></select></div><div class="field"><label>New-tab wallpaper image URL</label><input id="wallpaper" placeholder="https://example.com/wallpaper.jpg"></div><div class="field"><label>New-tab font size</label><input id="fontsize" type="range" min="12" max="18" value="'+settings.font+'"></div><div class="field"><label><input id="adblock" type="checkbox" '+(settings.adblock?"checked":"")+'> Enable cosmetic ad-block styling (new-tab UI only)</label></div><button class="action primary" id="saveSettings">Save settings</button><p style="color:#8e93a4;line-height:1.5;margin-top:18px">Funny.py uses the GUST libcurl.js/WISP engine. The WISP endpoint selected in Settings is used for proxied browsing.</p>';
 $("#searchEngine").value=settings.search;$("#wallpaper").value=settings.wallpaper||"";
 $("#saveSettings").onclick=()=>{settings.search=$("#searchEngine").value;settings.wallpaper=$("#wallpaper").value.trim();settings.font=Number($("#fontsize").value);settings.adblock=$("#adblock").checked;save("funny_settings",settings);applySettings();toast("Settings saved")};
 }else if(which==="history"){
 body.innerHTML='<div class="row"><button class="action" id="clearHistory">Clear history</button></div><div id="historyList"></div>';
 $("#historyList").innerHTML=settings.history.map(h=>'<div class="entry"><span>◷</span><div class="entrymain"><div>'+escapeHTML(h.title||h.url)+'</div><small>'+escapeHTML(h.url)+'</small></div><button data-url="'+encodeURIComponent(h.url)+'">↗</button></div>').join("");
 $("#historyList").querySelectorAll("button").forEach(b=>b.onclick=()=>navigate(decodeURIComponent(b.dataset.url)));
 $("#clearHistory").onclick=()=>{settings.history=[];save("funny_settings",settings);openPanel("history")};
 }else if(which==="bookmarks"){
 body.innerHTML=settings.bookmarks.length?settings.bookmarks.map((b,i)=>'<div class="entry"><span>☆</span><div class="entrymain"><div>'+escapeHTML(b.title)+'</div><small>'+escapeHTML(b.url)+'</small></div><button data-open="'+i+'">↗</button><button data-remove="'+i+'">×</button></div>').join(""):"<p style='color:#9297a8'>No bookmarks yet. Use the ☆ button in the address bar to save a page.</p>";
 body.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>navigate(settings.bookmarks[+b.dataset.open].url));body.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{settings.bookmarks.splice(+b.dataset.remove,1);save("funny_settings",settings);renderBookmarks();openPanel("bookmarks")});
 }else if(which==="tools"){
 body.innerHTML='<div class="metric"><strong>'+tabs.length+'</strong><span>Open tabs</span></div><div class="metric"><strong>'+logs.length+'</strong><span>Browser events recorded</span></div><div class="metric"><strong id="heap">—</strong><span>JS heap used (when supported)</span></div><div class="row"><button class="action" id="showLogs">Request / navigation log</button><button class="action" id="inspect">Inspect page elements</button></div><div class="row" style="margin-top:8px"><button class="action" id="metricsRefresh">Refresh metrics</button><button class="action" id="clearLogs">Clear logs</button></div><div id="loglist" style="margin-top:12px"></div>';
 const mem=performance.memory;$("#heap").textContent=mem?(mem.usedJSHeapSize/1048576).toFixed(1)+" MB":"Unavailable";
 $("#showLogs").onclick=()=>renderLogs();$("#metricsRefresh").onclick=()=>openPanel("tools");$("#clearLogs").onclick=()=>{logs=[];renderLogs()};$("#inspect").onclick=()=>startInspector();
 }else if(which==="downloads"){
 body.innerHTML="<p style='color:#9297a8'>Downloads started inside proxied pages depend on the target site and browser permissions. Your browser's normal downloads list remains available through the browser menu.</p>";
 }
}
function renderLogs(){const list=$("#loglist");if(!list)return;list.innerHTML=logs.map(l=>'<div class="log"><time>'+escapeHTML(l.time)+'</time>'+escapeHTML(l.message)+'</div>').join("")||"<p style='color:#9297a8'>No events yet.</p>"}
function closePanel(){panel=null;$("#sidepanel").classList.remove("open")}
function applySettings(){document.documentElement.style.setProperty("--font-size",settings.font+"px");if(settings.wallpaper){$("#home").style.background="linear-gradient(#10111699,#101116bb),url('"+settings.wallpaper.replace(/'/g,"%27")+"') center/cover fixed"}else{$("#home").style.background="radial-gradient(ellipse at 50% 18%,#25213a 0,#151621 42%,#101116 78%)"}renderFavorites();renderBookmarks()}
function startInspector(){
 const t=activeTab();if(!t?.frame){toast("Open a page first");return}
 try{
  const doc=t.frame.contentDocument;if(!doc)throw new Error("Page is not accessible");
  inspectMode=true;$("#inspectorHint").style.display="block";closePanel();
  const handler=e=>{if(!inspectMode)return;e.preventDefault();e.stopPropagation();const el=e.target;el.style.outline="2px solid #9b7cff";const info={tag:el.tagName.toLowerCase(),id:el.id||"(none)",classes:el.className?.toString?.()||"(none)",text:(el.textContent||"").trim().slice(0,180)};openPanel("tools");$("#loglist").innerHTML='<div class="metric"><strong>'+escapeHTML(info.tag)+'</strong><span>Selected element</span></div><div class="log">ID: '+escapeHTML(info.id)+'</div><div class="log">Classes: '+escapeHTML(info.classes)+'</div><div class="log">Text: '+escapeHTML(info.text)+'</div>';stopInspector();};
  doc.addEventListener("click",handler,true);window._funnyInspector={doc,handler};toast("Click an element inside the page");
 }catch(e){toast("Inspector unavailable for this page");log("Inspector error: "+e.message,"error")}
}
function stopInspector(){inspectMode=false;$("#inspectorHint").style.display="none";if(window._funnyInspector){window._funnyInspector.doc.removeEventListener("click",window._funnyInspector.handler,true);window._funnyInspector=null}}
function updateClock(){const d=new Date();$("#clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});$("#date").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})}
$("#go").onclick=()=>navigate($("#address").value);$("#address").addEventListener("keydown",e=>{if(e.key==="Enter")navigate($("#address").value)});
$("#homego").onclick=()=>navigate($("#homeaddress").value);$("#homeaddress").addEventListener("keydown",e=>{if(e.key==="Enter")navigate($("#homeaddress").value)});
$("#newtab").onclick=()=>createTab();$("#back").onclick=goBack;$("#forward").onclick=goForward;$("#reload").onclick=()=>{const t=activeTab();if(t?.url&&!internalRoute(t.url))showProxiedPage(t.url).catch(e=>toast("Reload failed: "+e.message));else showHome()};$("#homebtn").onclick=showHome;
$("#bookmarkCurrent").onclick=()=>{const t=activeTab();if(t?.url)addBookmark(t.url,t.title);else toast("Open a page to bookmark it")};
$("#addBookmark").onclick=()=>{const t=activeTab();if(t?.url)addBookmark(t.url,t.title);else toast("Open a page first")};
$("#panelclose").onclick=closePanel;document.querySelectorAll("[data-panel]").forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
$("#editFavorites").onclick=()=>{const raw=prompt("Enter favorite websites, one per line, as Name | URL",settings.favorites.map(f=>f[0]+" | "+f[2]).join("\n"));if(raw===null)return;const list=raw.split("\n").map(line=>{const p=line.split("|").map(x=>x.trim());if(p.length<2||!p[1])return null;return [p[0]||"Website","🌐",normalize(p.slice(1).join("|"))]}).filter(Boolean);settings.favorites=list;save("funny_settings",settings);renderFavorites()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&inspectMode)stopInspector();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="t"){e.preventDefault();createTab()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="w"){e.preventDefault();closeTab(activeId)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="l"){e.preventDefault();$("#address").focus();$("#address").select()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"){e.preventDefault();$("#bookmarkCurrent").click()}if(e.altKey&&e.key==="ArrowLeft")goBack();if(e.altKey&&e.key==="ArrowRight")goForward()});
window.addEventListener("error",e=>log("JavaScript: "+e.message,"error"));
window.addEventListener("unhandledrejection",e=>log("Promise: "+String(e.reason),"error"));
applySettings();applyExtensions();applyPrivacyPreset();document.addEventListener("visibilitychange",privacyEvent);window.addEventListener("blur",()=>{const cfg=load("funny_privacy",{enabled:false});if(cfg.enabled)$("#privacyCover").classList.add("visible")});window.addEventListener("focus",()=>$("#privacyCover").classList.remove("visible"));updateClock();setInterval(updateClock,15000);createTab();
log("Funny.py browser started");
</script>
